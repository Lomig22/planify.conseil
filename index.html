<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF6EF">
  <title>Planify – Canal WhatsApp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://connect.facebook.net">
  <link rel="preload" as="image" href="https://planify-conseils.ch/wp-content/uploads/2024/09/logo-planify.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --violet: #482F70;        /* couleur principale Planify (logo + site) */
      --violet-fonce: #36234F;  /* survol du bouton */
      --beige: #E2D3B8;         /* couleur d'accent Planify */
      --fond: #FAF6EF;          /* beige très clair */
      --gris: #5A5563;          /* texte secondaire, contraste 7:1 sur le fond */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fond);
      color: var(--violet);
      font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.4;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      display: block;
      width: 160px;
      height: auto;
    }

    .separateur {
      width: 48px;
      height: 3px;
      margin: 32px auto;
      border-radius: 2px;
      background: var(--beige);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 40px;
    }

    .bouton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 16px 12px;
      border-radius: 12px;
      background: var(--violet);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.25;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .bouton:hover,
    .bouton:active { background: var(--violet-fonce); }

    .bouton:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 3px;
    }

    .bouton svg {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .mention {
      margin-top: 16px;
      color: var(--gris);
      font-size: 18px;
      font-weight: 500;
    }

    @media (min-width: 768px) {
      .logo { width: 200px; }
      h1 { font-size: 26px; }
      .bouton { width: auto; min-width: 360px; padding: 18px 36px; font-size: 19px; }
    }
  </style>

  <!-- Meta Pixel : remplacer ID_DU_PIXEL_PLANIFY (2 occurrences dans ce fichier) -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'ID_DU_PIXEL_PLANIFY');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=ID_DU_PIXEL_PLANIFY&ev=PageView&noscript=1"></noscript>
</head>
<body>
  <main>
    <img class="logo"
         src="https://planify-conseils.ch/wp-content/uploads/2024/09/logo-planify.png"
         alt="Planify Conseils" width="849" height="292" fetchpriority="high">

    <div class="separateur" aria-hidden="true"></div>

    <h1>Merci, votre demande est bien enregistrée.</h1>

    <a id="rejoindre" class="bouton" href="https://chat.whatsapp.com/LpEUU7nht3WECvfEP4gSoS">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
      </svg>
      <span>Rejoindre le canal WhatsApp</span>
    </a>

    <p class="mention">Gratuit et sans engagement</p>
  </main>

  <script>
    // Envoie l'événement Contact puis ouvre WhatsApp dans le même onglet.
    // Court délai pour laisser partir la requête du pixel avant la navigation.
    document.getElementById('rejoindre').addEventListener('click', function (e) {
      var url = this.href;
      if (typeof window.fbq !== 'function') return;
      e.preventDefault();
      var parti = false;
      function go() { if (!parti) { parti = true; window.location.href = url; } }
      try { fbq('track', 'Contact'); } catch (err) {}
      setTimeout(go, 300);
    });
  </script>
</body>
</html>
